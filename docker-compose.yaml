services:
  mongodb:
    image: mongo:7
    container_name: product-mongodb
    ports:
      - "127.0.0.1:27020:27017"
    volumes:
      - product_mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  product-api:
    build: .
    image: product-api:1.0
    container_name: product-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/${MONGO_DB:-productdb}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: on-failure

volumes:
  product_mongo_data:
