name: CD Docker Hub

on:
  workflow_run:
    workflows: ["Test Product CI Prod"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: Build, healthcheck và đẩy image lên Docker Hub
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Lấy mã nguồn đúng commit đã qua CI
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build và chạy, chờ healthcheck
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Xác nhận cả hai dịch vụ healthy
        run: |
          docker compose ps
          test "$(docker inspect -f '{{.State.Health.Status}}' product-mongodb)" = "healthy"
          test "$(docker inspect -f '{{.State.Health.Status}}' product-api)" = "healthy"

      - name: Smoke test CRUD
        run: bash scripts/smoke-test.sh http://localhost:3000

      - name: Gắn tag cho image đã qua healthcheck
        run: |
          docker tag product-api:1.0 "$DOCKERHUB_USER/product-api:latest"
          docker tag product-api:1.0 "$DOCKERHUB_USER/product-api:${SHA::7}"

      - name: Đẩy image lên Docker Hub
        run: |
          docker push "$DOCKERHUB_USER/product-api:latest"
          docker push "$DOCKERHUB_USER/product-api:${SHA::7}"

      - name: In log khi có lỗi
        if: failure()
        run: docker compose logs

      - name: Dọn dẹp
        if: always()
        run: docker compose down -v
  deploy:
    name: Triển khai lên Docker Engine trên máy local
    needs: publish
    runs-on: self-hosted
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Lấy docker-compose-prod.yaml đúng commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Chọn đúng tag image vừa đẩy lên Docker Hub
        shell: powershell
        run: |
          $tag = $env:SHA.Substring(0,7)
          "IMAGE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Kéo image mới và chạy lại, chờ healthcheck
        shell: powershell
        run: |
          docker compose -f docker-compose-prod.yaml pull
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker compose -f docker-compose-prod.yaml up -d --wait --wait-timeout 120
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker compose -f docker-compose-prod.yaml ps

      - name: Xác nhận bản triển khai khỏe
        shell: powershell
        run: |
          $api = docker inspect -f "{{.State.Health.Status}}" prod-product-api
          $db = docker inspect -f "{{.State.Health.Status}}" prod-mongodb
          Write-Host "product-api: $api, mongodb: $db"
          if ($api -ne "healthy" -or $db -ne "healthy") { exit 1 }
          $r = Invoke-RestMethod http://localhost:3100/health
          Write-Host ($r | ConvertTo-Json -Compress)
          if ($r.status -ne "ok") { exit 1 }

      - name: In log khi có lỗi
        if: failure()
        shell: powershell
        run: docker compose -f docker-compose-prod.yaml logs --tail 50
