name: CI/CD Pipeline with Healthcheck & Docker Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # GIAI ĐOẠN 1: CONTINUOUS INTEGRATION (CI)
  # ==========================================
  ci-healthcheck-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Khởi chạy toàn bộ hệ thống (API + MongoDB) qua Docker Compose
      - name: Start Services via Docker Compose
        run: docker compose up -d --build

      # 2. Kiểm tra Healthcheck cho cả MongoDB và Product API
      - name: Verify Container Healthcheck Status
        run: |
          echo "⏳ Đang chờ các service khởi chạy và đạt trạng thái Healthy..."

          # Đợi tối đa 60 giây cho các container
          TIMEOUT=60
          ELAPSED=0

          until [ $ELAPSED -ge $TIMEOUT ]; do
            MONGO_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' nammongodb 2>/dev/null || echo '"starting"')
            API_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' product-api-app 2>/dev/null || echo '"starting"')
            
            echo "Thời gian: ${ELAPSED}s | MongoDB: $MONGO_HEALTH | Product API: $API_HEALTH"
            
            if [ "$MONGO_HEALTH" = '"healthy"' ] && [ "$API_HEALTH" = '"healthy"' ]; then
              echo "✅ Cả MongoDB và Product API đều đạt trạng thái HEALTHY!"
              break
            fi
            
            sleep 5
            ELAPSED=$((ELAPSED+5))
          done

          if [ "$MONGO_HEALTH" != '"healthy"' ] || [ "$API_HEALTH" != '"healthy"' ]; then
            echo "❌ Healthcheck thất bại! Xem logs của các container:"
            docker compose logs
            exit 1
          fi

      # 3. Dừng các container sau khi kiểm tra xong CI
      - name: Tear Down Services
        if: always()
        run: docker compose down -v

  # ==========================================
  # GIAI ĐOẠN 2: CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  cd-push-to-dockerhub:
    needs: ci-healthcheck-and-test # Chỉ chạy CD khi giai đoạn CI thành công
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Đăng nhập vào Docker Hub bằng GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Build và Push Docker Image lên Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
