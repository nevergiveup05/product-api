version: "3.8"

services:
  # Service 1: Database MongoDB với Healthcheck
  nammongodb:
    image: mongo:latest
    container_name: nammongodb
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Gửi lệnh ping tới CSDL MongoDB
      test:
        [
          "CMD-SHELL",
          "mongosh --eval 'db.runCommand({ping:1})' || mongo --eval 'db.runCommand({ping:1})'",
        ]
      interval: 10s # Kiểm tra định kỳ mỗi 10 giây
      timeout: 5s # Thời gian chờ phản hồi tối đa 5 giây
      retries: 5 # Thử lại tối đa 5 lần trước khi báo Unhealthy
      start_period: 10s # Khung thời gian chờ cho MongoDB khởi động xong
    networks:
      - app-network

  # Service 2: Application Product API với Healthcheck
  product-api:
    build: .
    container_name: product-api-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://nammongodb:27017/product_db
    depends_on:
      nammongodb:
        # Đảm bảo product-api chỉ khởi chạy khi nammongodb đã thực sự HEALTHY
        condition: service_healthy
    healthcheck:
      # Kiểm tra endpoint HTTP API bằng lệnh wget
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/api/products || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
